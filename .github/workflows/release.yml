name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,langgraph,langchain,sqlite,redis]"

      - name: Run tests
        run: pytest tests/ -x --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write   # needed to create the GitHub Release
      id-token: write   # needed for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Verify tag matches __version__
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "
          import re, pathlib
          src = pathlib.Path('triage/__init__.py').read_text()
          m = re.search(r'^__version__\s*=\s*[\"\'](.*?)[\"\']', src, re.M)
          print(m.group(1))
          ")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ = $PKG_VERSION"
            exit 1
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ env.VERSION }}"
          body: |
            See [CHANGELOG.md](https://github.com/mattekudacy/triage/blob/main/CHANGELOG.md) for what's new in this release.
          files: dist/*
