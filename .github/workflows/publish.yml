name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.14.0) — must match triage/__init__.py"
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev,langgraph,langchain,sqlite,redis]"

      - name: Run tests
        run: pytest tests/ -x --tb=short

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Verify version matches input
        run: |
          PKG_VERSION=$(python -c "
          import re, pathlib
          src = pathlib.Path('triage/__init__.py').read_text()
          m = re.search(r'^__version__\s*=\s*[\"\'](.*?)[\"\']', src, re.M)
          print(m.group(1))
          ")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "Version mismatch: __init__.py has $PKG_VERSION but input was ${{ inputs.version }}"
            exit 1
          fi

      - name: Build
        run: python -m build

      - name: Check distribution
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
