name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          pip install -e ".[dev,anthropic,langgraph,langchain,sqlite,redis,otel]"

      - name: Run tests
        run: |
          pytest tests/ -x --tb=short

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with all optional extras
        run: pip install -e ".[dev,anthropic,langgraph,langchain,sqlite,redis,otel]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy triage/ --strict

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,anthropic,langgraph,langchain,sqlite,redis,otel]"

      - name: Run tests with coverage
        run: pytest tests/ --cov=triage --cov-report=term-missing --cov-fail-under=80

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tools
        run: pip install build twine

      - name: Build
        run: python -m build

      - name: Check distribution
        run: twine check dist/*
