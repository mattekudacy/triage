repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--strict]
        files: ^triage/
        additional_dependencies:
          - anyio
          - pydantic
          - anthropic
          - openai
          - aiosqlite
          - redis
          - langgraph
          - langchain
          - langchain-core
          - opentelemetry-sdk
          - opentelemetry-api
