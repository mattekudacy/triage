  .demph-stroke { stroke: var(--demph); fill: none; stroke-width: 2;
                  stroke-linejoin: round; stroke-linecap: round; }
  .ring { stroke: var(--surface); stroke-width: 2; }
  .ann { stroke: var(--muted); stroke-width: 1; fill: none; }
