  .in-bar { fill: #ffffff; font-size: 12px; font-weight: 600; }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .s1-fill { fill: var(--s1); }
  .s2-fill { fill: var(--s2); }
  .demph-fill { fill: var(--demph); }
  .s1-stroke { stroke: var(--s1); fill: none; stroke-width: 2;
