<svg xmlns="http://www.w3.org/2000/svg" width="880" height="467" viewBox="0 0 880 467" role="img" aria-label="Every corpus reaches 100% once it becomes training data"><style>
  :root {
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
