site_name: triage
site_description: Classify why your agent failed. Recover intelligently.
site_url: https://mattekudacy.github.io/triage
repo_url: https://github.com/mattekudacy/triage
repo_name: mattekudacy/triage
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            docstring_style: numpy
            members_order: source

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - How It Works: getting-started/how-it-works.md
  - Concepts:
    - Failure Types: concepts/failure-types.md
    - Classifiers: concepts/classifiers.md
    - Policies & Actions: concepts/policies.md
    - Checkpoints: concepts/checkpoints.md
    - Attempt History: concepts/attempt-history.md
  - Adapters:
    - Overview: adapters/index.md
    - LangGraph: adapters/langgraph.md
    - CrewAI: adapters/crewai.md
    - OpenAI Agents SDK: adapters/openai-agents.md
    - LangChain: adapters/langchain.md
  - Examples:
    - OpenAI: examples/openai.md
    - Anthropic: examples/anthropic.md
    - Ollama: examples/ollama.md
    - Groq: examples/groq.md
    - HuggingFace: examples/huggingface.md
    - Durable Checkpoints: examples/durable-checkpoints.md
    - LLM Classifier: examples/llm-classifier.md
  - Known Limitations: known-limitations.md
  - API Reference:
    - Agent: api/agent.md
    - FailurePolicy: api/policy.md
    - RecoveryAction: api/recovery-action.md
    - FailureType & Step: api/taxonomy.md
    - Classifiers: api/classifiers.md
    - Checkpoints: api/checkpoints.md
    - Strategies: api/strategies.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mattekudacy/triage
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/triage-agent
