[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-agent"
dynamic = ["version"]
description = "Classify why your agent failed. Recover intelligently."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai", "agents", "llm", "reliability", "recovery", "observability"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

dependencies = [
    "anyio>=4.0",
    "pydantic>=2.0",
    "typing-extensions>=4.8; python_version < '3.11'",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20"]
anthropic = ["anthropic>=0.25"]
langgraph = ["langgraph>=0.2"]
langchain = ["langchain-core>=0.1", "langchain>=0.1,<0.4"]
yaml = ["pyyaml>=6.0"]
sqlite = ["aiosqlite>=0.19"]
redis = ["redis>=5.0"]
# `dev` is intentionally complete: it installs every optional dependency the test
# suite touches, so `pip install -e ".[dev]"` runs the full suite with zero skips.
# CI, release, and publish workflows all install exactly this one extra.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.8",
    "ruff>=0.3",
    "pre-commit>=3.7",
    "openai>=1.0",
    "anthropic>=0.25",
    "aiosqlite>=0.19",
    "redis>=5.0",
    "fakeredis>=2.20",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "langchain-core>=0.1",
    "langchain>=0.1,<0.4",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-api>=1.20",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    # Not used by triage/ or the test suite — only by scripts/gen_readme_charts.py.
    # Listed here anyway so `pip install -e ".[dev]"` covers the repo's tooling, not
    # just the tests, matching how anthropic/openai are here for the other scripts.
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/mattekudacy/triage"
Documentation = "https://mattekudacy.github.io/triage"
Changelog = "https://github.com/mattekudacy/triage/blob/main/CHANGELOG.md"
Issues = "https://github.com/mattekudacy/triage/issues"

[tool.hatch.version]
path = "triage/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["triage"]

[tool.hatch.build.targets.sdist]
include = ["triage/", "tests/", "examples/", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["docs/**", "*.md"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["triage"]
omit = ["triage/observability/*"]  # OTel paths require optional dep to cover meaningfully

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
# follow_imports = "skip" here, not just ignore_missing_imports: triage/ only calls
# these libraries' public APIs, and mypy fully parsing their internal implementation
# files is both unnecessary and fragile — langchain_core/embeddings/fake.py (real,
# non-stub source mypy otherwise parses in full) does `import numpy`, and a numpy
# release can ship .pyi stubs using syntax newer than this project's python_version
# target (PEP 695 `type` statements, 3.12+ only), which is a hard parse-time syntax
# error, not a normal type error — it aborts the whole run, and ignore_missing_imports
# alone does not stop mypy from parsing a stub/module it DOES find. skip treats the
# whole package as opaque Any without recursing into its source at all, sidestepping
# whatever transitive import chain happens to reach numpy/pandas/etc. this release.
# opentelemetry is deliberately NOT in this list — see the next override block.
module = [
    "anthropic",
    "anthropic.*",
    "openai",
    "openai.*",
    "aiosqlite",
    "redis",
    "redis.*",
    "langgraph",
    "langgraph.*",
    "langchain",
    "langchain.*",
    "langchain_core",
    "langchain_core.*",
    "tomllib",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# opentelemetry stays on plain ignore_missing_imports (no follow_imports skip): unlike
# the packages above, triage/observability/otel_ingest.py relies on mypy actually
# resolving opentelemetry.trace.StatusCode's real type (e.g. _is_error_span's
# `status_code == StatusCode.ERROR` comparison) — skip would turn that into Any and
# trip warn_return_any under --strict. opentelemetry doesn't reach numpy, so it never
# hit the parse-error problem the override above exists for.
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["triage.policy", "triage.classifier.llm", "triage.adapters.langchain"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Observability modules use conditional imports for optional OTel/metrics deps;
# the fallback assignments (Tracer = Any, _otel_trace = None) deliberately
# assign incompatible types — suppress only those two codes so real bugs stay visible.
module = ["triage.observability.*"]
disable_error_code = ["assignment", "misc"]
